data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/buchwald-hartwig/bh_reaction_2.csv
    input_column: procedure
    target_column: objective
    maximize: true
    exclude_top: true
    normalize_input: original
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_tokens
        model_name: t5-base
        pooling_method: average
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: true_random
        n_clusters: 10
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "kriging"
    batch_size: 1
acquisition:
  class_path: botorch.acquisition.analytic.ExpectedImprovement
  init_args:
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.DeepGP
  init_args:
    likelihood:
      class_path: gpytorch.likelihoods.GaussianLikelihood
      init_args:
        noise_prior: null
        noise_constraint: null
        batch_shape:
          class_path: torch.Size
    covar_module:
      class_path: gpytorch.kernels.ScaleKernel
      init_args:
        base_kernel:
          class_path: gpytorch.kernels.MaternKernel
          init_args:
            nu: 2.5
            ard_num_dims: null
            batch_shape: null
            active_dims: null
            lengthscale_prior: null
            lengthscale_constraint: null
        outputscale_prior: null
        outputscale_constraint: null
        ard_num_dims: null
        batch_shape: null
        active_dims: null
        lengthscale_prior: null
        lengthscale_constraint: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    # softplus(0): what every run before the hyper-init fix actually used, whatever the config said.
    # Pinned so this arm differs from the baseline only in the embedding normalization.
    initial_noise_val: 0.6931
    noise_constraint: 1.0e-04
    initial_outputscale_val: 0.6931
    # left at the pre-fix default so the only change against the baseline is the normalization
    initial_lengthscale_val: 0.6931
    median_heuristic_init: false
    gp_lr: 0.2
    ft_lr: 0.002
    scale_embeddings: true
    # per_dim: min-max each embedding dimension separately, instead of one global scalar.
    # Mirrors the "local" branch of Chen/Fleck/Stuyver's chemical-BO featurization.
    # Bounds kept at the global scaler's (-1, 1) so this differs from the baseline only in the
    # axis; theirs targets [0, 1], which halves every distance.
    embedding_norm: per_dim
    embedding_norm_bounds: [-1.0, 1.0]
    train_mll_additionally: false
    finetuning_model:
      class_path: gollum.featurization.deep.LLMFeaturizer
      init_args:
        projection_dim: 64
        from_top: true
        target_ratio: 0.25
        model_name: t5-base
        pooling_method: average
        normalize_embeddings: false
        lora_dropout: 0.2
        trainable: true
n_iters: 50
seed: 4
