data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/flip2/alpha-amylase/one_to_many_train.csv
    input_column: sequence
    target_column: target
    maximize: true
    exclude_top: true
    normalize_input: original
    reduce_dim: null
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_tokens
        model_name: EvolutionaryScale/esmc-600m-2024-12
        pooling_method: average
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: sobol
        n_clusters: 96
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "kriging"
    batch_size: 96
acquisition:
  class_path: botorch.acquisition.analytic.ExpectedImprovement
  init_args:
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.DeepGP
  init_args:
    likelihood: null
    covar_module:
      class_path: gpytorch.kernels.ScaleKernel
      init_args:
        base_kernel:
          class_path: gpytorch.kernels.MaternKernel
          init_args:
            nu: 2.5
            ard_num_dims: null
        outputscale_prior: null
        ard_num_dims: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    initial_noise_val: 1.0
    noise_constraint: 1.0e-04
    gp_lr: 0.2
    ft_lr: 0.002
    scale_embeddings: true         # global scale_to_bounds (correct for isotropic matern_plain)
    train_mll_additionally: false
    finetuning_model:
      class_path: gollum.featurization.deep.LLMFeaturizer
      init_args:
        input_dim: 1152            # ESM-C 600M hidden size (kernel acts on this dim)
        projection_dim: null       # NO projection -> kernel sees the 1152-d embedding
        from_top: true
        target_ratio: 0.25
        model_name: EvolutionaryScale/esmc-600m-2024-12
        pooling_method: average
        normalize_embeddings: false
        lora_dropout: 0.2
        trainable: true
name: llmphi_esmc
phase1_iters: 3
phase2_iters: 3
seed: 0
