# DeepGP arm: ESM-C fine-tuned end-to-end (LoRA) with a projection layer, GP on top.
#
# CAVEAT: DeepGP drives the model through `get_tokens` + `LLMFeaturizer` (HuggingFace
# AutoModel/AutoTokenizer + LoRA). ESM-C is normally loaded via the EvolutionaryScale
# `esm` SDK, NOT a plain HF AutoModel, so this arm requires:
#   (a) the ESM-C HF repo below to load via trust_remote_code (esm installed), and
#   (b) LLMFeaturizer.get_target_layers to find LoRA-able layers in that architecture.
# It may need extra wiring before it runs — treat as a template. The frozen-embedding
# ESM-C arm (configs/flip2_arms/esmc_dense.yaml) works today without this.
data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/flip2/alpha-amylase/one_to_many.csv
    input_column: sequence
    target_column: target
    maximize: true
    exclude_top: true
    respect_split: true
    split_column: set
    normalize_input: original
    reduce_dim: null
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_tokens
        model_name: EvolutionaryScale/esmc-600m-2024-12   # HF id (needs trust_remote_code + esm)
        pooling_method: average
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: true_random
        n_clusters: 96
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "kriging"
    batch_size: 96
acquisition:
  class_path: botorch.acquisition.analytic.ExpectedImprovement
  init_args:
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.DeepGP
  init_args:
    likelihood:
      class_path: gpytorch.likelihoods.GaussianLikelihood
      init_args:
        noise_prior: null
        noise_constraint: null
        batch_shape:
          class_path: torch.Size
    covar_module:
      class_path: gpytorch.kernels.ScaleKernel
      init_args:
        base_kernel:
          class_path: gpytorch.kernels.MaternKernel
          init_args:
            nu: 2.5
            ard_num_dims: null
            batch_shape: null
            active_dims: null
            lengthscale_prior: null
            lengthscale_constraint: null
        outputscale_prior: null
        outputscale_constraint: null
        ard_num_dims: null
        batch_shape: null
        active_dims: null
        lengthscale_prior: null
        lengthscale_constraint: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    initial_noise_val: 1.0
    noise_constraint: 1.0e-04
    initial_outputscale_val: 1.0
    initial_lengthscale_val: 1.0
    gp_lr: 0.2
    ft_lr: 0.002
    scale_embeddings: true
    train_mll_additionally: false
    finetuning_model:
      class_path: gollum.featurization.deep.LLMFeaturizer
      init_args:
        input_dim: 1152            # ESM-C 600M hidden size — VERIFY for your checkpoint
        projection_dim: 64
        from_top: true
        target_ratio: 0.25
        model_name: EvolutionaryScale/esmc-600m-2024-12
        pooling_method: average
        normalize_embeddings: false
        lora_dropout: 0.2
        trainable: true
name: pllmphi_esmc_dense
mode: both
phase1_iters: 3
phase2_iters: 5
seed: 0
