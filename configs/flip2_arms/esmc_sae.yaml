# Representation-comparison arm: sparse-autoencoder features over ESM-C, with a
# sparse-ARD GP (SAASBO-lite). Most experimental arm.
# Requires both the `esm` package AND trained SAE weights at sae_weights_path;
# errors clearly if either is missing so the sweep can skip it.
data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/flip2/alpha-amylase/one_to_many.csv
    input_column: sequence
    target_column: target
    maximize: true
    exclude_top: true
    respect_split: true
    split_column: set
    normalize_input: standard_scaling_per_dim
    reduce_dim: null               # no PCA for this arm (guard against config-merge leaks)
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_esmc_sae_features
        model_name: esmc_300m
        pooling_method: average
        sae_weights_path: null      # set to trained SAE weights to enable this arm
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: true_random
        n_clusters: 96
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "kriging"
    batch_size: 96
acquisition:
  class_path: botorch.acquisition.analytic.ExpectedImprovement
  init_args:
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.SparseArdGP
  init_args:
    likelihood: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    initial_noise_val: 1.0
    noise_constraint: 1.0e-04
    initial_outputscale_val: 1.0
    initial_lengthscale_val: 1.0
    nu: 2.5
    lengthscale_prior_concentration: 3.0
    lengthscale_prior_rate: 6.0
name: esmc_sae
mode: gate
n_iters: 3
seed: 0
