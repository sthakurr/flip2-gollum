# Representation-comparison arm: ESM2 embeddings reduced to effective dimension
# via PCA (fit on train rows), so the dimension-scaled prior uses an honest d.
data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/flip2/alpha-amylase/one_to_many_train.csv
    input_column: sequence
    target_column: target
    maximize: true
    exclude_top: true
    normalize_input: per_dim_normalisation
    reduce_dim: 128               # PCA components (int) — caps effective dim
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_huggingface_embeddings
        model_name: facebook/esm2_t33_650M_UR50D
        pooling_method: average
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: sobol
        n_clusters: 96
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "topk"
    batch_size: 96
acquisition:
  class_path: botorch.acquisition.analytic.ExpectedImprovement
  init_args:
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.GP
  init_args:
    likelihood: null
    covar_module:
      class_path: gpytorch.kernels.ScaleKernel
      init_args:
        base_kernel:
          class_path: gpytorch.kernels.MaternKernel
          init_args:
            nu: 2.5
            ard_num_dims: null
        outputscale_prior: null
        ard_num_dims: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    initial_noise_val: 1.0
    noise_constraint: 1.0e-04
    initial_outputscale_val: 1.0
    initial_lengthscale_val: 1.0
name: static_esm2_pca
phase1_iters: 3
phase2_iters: 3
seed_source: phase1_bo
seed: 0
