# Dense ESM-C (ESM Cambrian) embeddings with mutation_context pooling, with LLM re-ranking of the acquisition function's shortlist (see reasoning block below). 
data:
  class_path: gollum.data.module.BaseDataModule
  init_args:
    data_path: data/flip2/alpha-amylase/one_to_many_train.csv
    input_column: sequence
    target_column: target
    maximize: true
    exclude_top: true
    normalize_input: standard_scaling
    reduce_dim: null               # no PCA for this arm (guard against config-merge leaks)
    featurizer:
      class_path: gollum.data.module.Featurizer
      init_args:
        representation: get_esmc_embeddings
        model_name: esmc_600m
        pooling_method: mutation_context_topk
        mutation_top_k: 4
        mutation_locality: 0.5
        mutation_temperature: 1.0
    initializer:
      class_path: gollum.initialization.initializers.BOInitializer
      init_args:
        method: sobol
        n_clusters: 96
bo:
  class_path: gollum.bo.optimizer.BotorchOptimizer
  init_args:
    batch_strategy: "topk"
    batch_size: 96
acquisition:
  class_path: botorch.acquisition.analytic.UpperConfidenceBound
  init_args:
    beta: 1.0                       # low beta -> exploitative
    maximize: True
surrogate_model:
  class_path: gollum.surrogate_models.gp.GP
  init_args:
    likelihood: null
    covar_module:
      class_path: gpytorch.kernels.ScaleKernel
      init_args:
        base_kernel:
          class_path: gpytorch.kernels.MaternKernel
          init_args:
            nu: 2.5
            ard_num_dims: null
        outputscale_prior: null
        ard_num_dims: null
    mean_module:
      class_path: gpytorch.means.ConstantMean
    standardize: true
    normalize: false
    initial_noise_val: 1.0
    noise_constraint: 1.0e-04
    initial_outputscale_val: 1.0
    initial_lengthscale_val: 1.0
reasoning:
  pool_size: 200                    # acquisition-function shortlist size handed to the LLM
  prompt_path: src/gollum/reasoning/prompts/p3.txt
  ensemble_size: 3                  # independent rerank calls per iteration, combined via Borda count
  llm_config:
    class_path: gollum.reasoning.llm.GeminiLLM
    init_args:
      model: gemini-3.6-flash
name: static_esmc_rerank
phase1_iters: 2
phase2_iters: 3
seed: 0
